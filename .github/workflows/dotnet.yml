name: .NET Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore Taska.sln
    
    - name: Build solution
      run: dotnet build Taska.sln --configuration Release --no-restore
    
    - name: Display build info
      run: |
        Write-Host "Build completed successfully!" -ForegroundColor Green
        Write-Host "All 11 projects built with .NET 10" -ForegroundColor Cyan
